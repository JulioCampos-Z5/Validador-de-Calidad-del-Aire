<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Validador de Calidad del Aire">
  <!--
    Icono de la aplicacion: el mismo viento de la cabecera (Wind, de lucide)
    sobre el azul de la interfaz.

    Va con fondo y no como trazo suelto porque aqui el icono se ve pegado a un
    escritorio, a una pestana o a una pantalla de inicio, donde un dibujo de
    linea sin fondo se pierde. El glifo conserva la retícula de lucide -24x24,
    trazo de 2, extremos redondeados- y solo se escala: el <svg> anidado deja
    un 18% de margen a cada lado, dentro de la zona segura que piden los
    iconos recortables de Android.
  -->
  <rect width="512" height="512" rx="112" fill="#2563eb"/>
  <svg x="96" y="96" width="320" height="320" viewBox="0 0 24 24"
       fill="none" stroke="#ffffff" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
    <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
    <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
  </svg>
</svg>
