<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Validador de Calidad del Aire">
  <!--
    Icono de la aplicacion: el mismo viento de la cabecera (Wind, de lucide),
    en el azul de la interfaz y sobre fondo transparente.

    Sin cuadro de color detras, asi que el glifo ocupa mas: donde antes habia
    un 18% de margen para dejar sitio a las esquinas redondeadas, ahora basta
    con un 8%. Conserva la reticula de lucide -24x24, trazo de 2, extremos
    redondeados- y solo se escala; el <svg> anidado es lo que hace ese escalado
    sin tocar los trazados.
  -->
  <svg x="40" y="40" width="432" height="432" viewBox="0 0 24 24"
       fill="none" stroke="#2563eb" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
    <path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/>
    <path d="M9.6 4.6A2 2 0 1 1 11 8H2"/>
    <path d="M12.6 19.4A2 2 0 1 0 14 16H2"/>
  </svg>
</svg>
