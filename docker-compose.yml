# Motor de análisis del Validador (Flask) en un servidor.
#
#   docker compose up -d --build
#
# Queda en http://localhost:8080. No es lo que abren las personas: la API de Go
# (api/) sirve el front v2 y le reenvía /api/analisis/*; apunta su
# VALIDADOR_BACKEND_URL aquí. Expón la API de Go por HTTPS: la sesión de la
# API de Emisiones viaja en las peticiones.

services:
  validador:
    build: .
    image: validador-calidad-aire:dev
    container_name: validador
    restart: unless-stopped
    ports:
      - "8080:8000"

    environment:
      # La red publica en hora de Guadalajara y el contenedor arranca en UTC.
      # El backend ya convierte por su cuenta (ver backend/horario.py), pero
      # esto deja tambien en hora local las trazas del servidor.
      TZ: America/Mexico_City

    volumes:
      # El instalador de Windows se compila fuera —PyInstaller no compila
      # para otro sistema— y se deja aquí. Si la carpeta está vacía, «Descargar
      # la app» simplemente no aparece.
      - ./salida-v2:/app/salida-v2:ro

      # Caché de descargas y archivos de trabajo. Sin este volumen se pierde al
      # reiniciar y la primera consulta de cada periodo vuelve a tardar: un
      # trimestre de la API de Emisiones son unos 112 s en frío y unos 25 s
      # después.
      - validador-cache:/tmp

      # Donde queda el token si alguien marca «recordar la sesión». Va aparte
      # del resto a propósito: es una credencial, y conviene poder borrarla sin
      # tirar la caché entera.
      - validador-sesion:/home/validador

    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health').read()"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  validador-cache:
  validador-sesion:
